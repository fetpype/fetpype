[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fetpype"
version = "2.0.0"
description = "Pipeline for reproducible fetal brain MRI analysis"                                                                                                                                                                                    
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fetal", "MRI", "neuroimaging", "pipeline", "nipype", "BIDS"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.9"
authors = [{name = "Thomas Sanchez", email = "thomas.sanchez@unil.ch"},
           {name = "Gerard Martí-Juan", email = "gerard.marti@upf.edu"},
           {name = "David Meunier", email = "david.meunier@univ-amu.fr"},
           {name = "Guillaume Auzias", email = "guillaume.auzias@univ-amu.fr"}]
dependencies = [
      "nipype>=1.10.0",
      "filelock<3.30",
      "hydra-core>=1.3.2",
      "networkx==2.8.7",
      "pybids>=0.15.0",
      "numpy>=1.26",
      "scipy>=1.15",
      "nibabel>=5.0",
      "pandas>=2.0",
  ]


[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "bump-my-version",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/fetpype/fetpype"
Documentation = "https://fetpype.github.io/fetpype/"
Changelog = "https://fetpype.github.io/fetpype/changelog/"
Issues = "https://github.com/fetpype/fetpype/issues"

[tool.setuptools.packages.find]
include = ["fetpype*"]

[tool.setuptools.package-data]
fetpype = ["configs/**/*.yaml"]


[project.scripts]
fetpype_run = "fetpype.workflows.pipeline_fet:main"
fetpype_run_rec = "fetpype.workflows.pipeline_rec:main"
fetpype_run_seg = "fetpype.workflows.pipeline_seg:main"
fetpype_run_surf = "fetpype.workflows.pipeline_surf:main"
fetpype_init_configs = "fetpype.utils.init_configs:main"

[tool.bumpversion]
current_version = "2.0.0"
commit = true
# Tags and GitHub releases are created by CI when the bump is merged on main
# (.github/workflows/release.yml), so no tag is created locally.
tag = false
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "fetpype/_version.py"

[[tool.bumpversion.files]]
filename = "citation.cff"
search = 'version: "v{current_version}"'
replace = 'version: "v{new_version}"'

[[tool.bumpversion.files]]
filename = "citation.cff"
regex = true
search = 'date-released: \d{{4}}-\d{{2}}-\d{{2}}'
replace = 'date-released: {now:%Y-%m-%d}'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = "## [Unreleased]\n\n## [{new_version}] - {now:%Y-%m-%d}"
